name: Publicar reglas

on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Publicar firestore.rules
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node reglas.mjs
