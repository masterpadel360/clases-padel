<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clases Pádel">
<title>Clases de Pádel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@200;300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: paneles de vidrio esmerilado flotando sobre un atardecer en la cancha — números grandes condensados, etiquetas mínimas en mayúscula, pastillas oscuras para acciones */
:root{
  --glass:rgba(238,231,225,.58); --glass-2:rgba(255,255,255,.42); --glass-strong:rgba(242,236,230,.9);
  --bg:rgba(255,255,255,.55); --surface:var(--glass); --surface-2:var(--glass-2);
  --line:rgba(255,255,255,.6); --line-2:rgba(30,26,23,.1);
  --ink:#1D1916; --muted:#6E645C; --paper:#F7F2ED;
  --btn:#1D1916; --btn-ink:#F7F2ED;
  --sun:#B5532F; --sun-ink:#FFF5EE;
  --jump:#35558A; --jump-soft:rgba(53,85,138,.12); --espacio:#2C7062; --espacio-soft:rgba(44,112,98,.13);
  --ok:#3D7A4C; --ok-soft:rgba(61,122,76,.14); --warn:#B44E22; --warn-soft:rgba(180,78,34,.13);
  --wa:#1F9D55;
  --f-display:"Antonio","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:24px;
  color-scheme:light;
}
html{background:#4A4B57}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;background:transparent;min-height:100vh}
.scene{position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(60% 35% at 72% 58%,rgba(255,186,128,.75),transparent 70%),
  radial-gradient(90% 50% at 20% 0%,rgba(52,60,82,.9),transparent 70%),
  linear-gradient(180deg,#3B4256 0%,#5E5D6C 22%,#9C7F7B 42%,#D6A07D 56%,#E3B08A 60%,#A9734F 66%,#7E523A 80%,#5A3A2A 100%)}
.scene svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:-.005em;line-height:.92}
.glass,.list,.empty,.hero,.brand,.tabs,.msg,.day,.search,.icon-btn,.chip,.notice{-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 132px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 8px 30px rgba(40,25,15,.18)}
.mark{font-size:20px}
.mark span{color:var(--ink)}
.mark span span{color:var(--sun)}
.brand-r{display:flex;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.icon-btn{width:38px;height:38px;border-radius:999px;border:0;background:var(--btn);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--btn-ink);fill:none;stroke-width:1.8}
.icon-btn:disabled{opacity:.3}
.icon-btn{color:var(--btn-ink);font-size:18px}
.clubs{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

h2{font-size:26px;margin:0;text-wrap:balance}
h3{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);margin:0;text-shadow:0 1px 8px rgba(40,25,15,.35)}
.sec{display:grid;gap:10px;margin-top:24px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head .small.muted,.sec-head>span.small{color:var(--paper);text-shadow:0 1px 8px rgba(40,25,15,.35)}
.sec-head h2{color:var(--paper);text-shadow:0 2px 14px rgba(40,25,15,.35)}
.list .sec-head h2,.list .sec-head .small.muted{color:inherit;text-shadow:none}
.sec>p.small.muted,.app>main>p.small.muted{color:rgba(247,242,237,.9);text-shadow:0 1px 8px rgba(40,25,15,.35)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Hero: panel grande de vidrio */
.hero{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(160deg,rgba(246,240,234,.72),rgba(228,218,210,.5));border:1px solid var(--line);padding:20px 20px 18px;display:grid;gap:14px;isolation:isolate;box-shadow:0 18px 50px rgba(40,25,15,.25)}
.hero svg.paddle{position:absolute;right:-22px;top:-8px;width:150px;height:195px;z-index:-1;filter:drop-shadow(0 16px 22px rgba(60,30,10,.35))}
.ballmark{width:20px;height:20px;flex:none}
.hero svg.courtlines{display:none}
.month{display:flex;align-items:center;gap:8px}
.pill-date{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink)}
.month button{background:var(--btn);border:0;color:var(--btn-ink);border-radius:999px;width:30px;height:30px;font-size:15px;line-height:1}
.hero-title{font-size:clamp(46px,15vw,72px);color:var(--ink)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:12px;border-top:1px solid var(--line-2)}
.stat .val{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;color:var(--ink)}
.stat .val small{font-size:16px;opacity:.55}
.stat .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:800}
.bar{height:5px;border-radius:99px;background:rgba(30,26,23,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;color:var(--ink)}
.hero .small{color:var(--muted)!important}

/* Listas */
.list{display:grid;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 10px 34px rgba(40,25,15,.16)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 16px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .main{min-width:0;display:grid;gap:3px;background:none;border:0;text-align:left;padding:0}
.row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.row-act{display:flex;gap:6px;align-items:center}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:999px}
.tag.JUMP{background:var(--jump-soft);color:var(--jump)}
.tag.ESPACIO{background:var(--espacio-soft);color:var(--espacio)}
.tag.rec{background:var(--warn-soft);color:var(--warn)}
.amt{border:1px dashed rgba(30,26,23,.25);background:transparent;border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.amt.aj{border-style:solid;border-color:var(--sun);color:var(--sun)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.big-num{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1}
.pay{border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;min-width:64px}
.pay.ok{background:var(--ok-soft);color:var(--ok)}
.pay.no{background:var(--warn-soft);color:var(--warn)}
.msg-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center}
.msg-btn svg{width:17px;height:17px;fill:var(--wa)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}
.empty b{color:var(--ink)}
.notice{padding:12px 16px;border-radius:var(--r);background:var(--glass-strong);color:var(--warn);font-size:14px;margin-top:16px;border:1px solid var(--line)}
.search{width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.search::placeholder,input::placeholder,textarea::placeholder{color:#8B8077}

/* Agenda */
.days{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}.days::-webkit-scrollbar{display:none}.days .day{flex:0 0 calc((100% - 36px)/7);min-width:46px;scroll-snap-align:start;position:relative}.day .cnt{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.04em}.day[aria-pressed="true"] .cnt{color:var(--btn-ink);opacity:.7}.day.hoy{box-shadow:inset 0 0 0 2px var(--sun)!important}.day .mes{position:absolute;top:-1px;left:50%;transform:translate(-50%,-55%);font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--sun);color:var(--sun-ink);padding:1px 6px;border-radius:99px}.days{padding-top:10px}
.day{border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:8px 0;display:grid;justify-items:center}
.day b{font-family:var(--f-display);font-weight:600;font-size:20px}
.day small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.day[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.day[aria-pressed="true"] small{color:var(--btn-ink);opacity:.75}
.slot{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--line-2)}
.slot:first-child{border-top:0}
.slot .h{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1}
.slot .who{display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-content:flex-start}
.slot .side{display:grid;gap:2px;align-content:start}
.free{color:var(--ok);font-weight:700}
.pill{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2)}
.pill.JUMP{box-shadow:inset 0 0 0 1px rgba(53,85,138,.3)}
.pill.ESPACIO{box-shadow:inset 0 0 0 1px rgba(44,112,98,.3)}
.linkish{background:none;border:0;color:var(--sun);font-weight:700;padding:0;font-size:13px}
.sec-head .linkish{color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.suspend{justify-self:start;margin-top:6px}

/* Botones */
.mini{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.mini.go{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.cta{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:7px 7px 7px 18px;text-decoration:none;font-size:14px;box-shadow:0 8px 22px rgba(30,20,10,.25)}
.cta i{width:30px;height:30px;border-radius:999px;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-style:normal}
.cta.wa{background:var(--btn);color:var(--btn-ink)}
.cta.wa i{background:var(--wa);color:#fff}
.cta[aria-disabled="true"]{opacity:.45;pointer-events:none}
.due{color:var(--warn);font-weight:700}
a.wa-link{color:var(--wa);font-weight:700;text-decoration:none}

/* Pestañas y botón flotante */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--glass-strong);border:1px solid var(--line);border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;box-shadow:0 14px 40px rgba(30,20,10,.3);max-width:620px;margin:0 auto}
.tab{border:0;background:none;padding:8px 0 7px;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);border-radius:22px;letter-spacing:.02em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--btn-ink);background:var(--btn)}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:11}

/* Hojas */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(30,20,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--glass-strong);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h2{color:var(--ink)}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{padding:11px 14px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.7);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px}
.hrow select,.hrow input{padding:10px 12px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.7)}
.x{border:1px solid var(--line-2);background:rgba(255,255,255,.7);border-radius:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.sec2{background:rgba(255,255,255,.6);border:1px solid var(--line-2)}
.btn.del{background:none;color:var(--warn);padding-inline:4px}
.btn.del.armed{background:var(--warn);color:#fff;padding-inline:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg-b{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
.seg-b.vino[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg-b.falto[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg-b.recupera[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);font-size:18px}
.stepper b{font-family:var(--f-display);font-weight:600;font-size:30px;min-width:28px;text-align:center}

/* Mensajes */
.msg{border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:grid;gap:10px;background:var(--glass)}
.msg-k{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg-k b{font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:16px;letter-spacing:.01em}
.bubble{background:rgba(255,255,255,.75);border:1px solid var(--line-2);border-radius:18px 18px 18px 6px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.msg-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sent{color:var(--ok);font-size:13px;font-weight:700}
.legend{font-size:12px;color:var(--muted);line-height:1.6}
.legend code{background:rgba(255,255,255,.7);padding:1px 5px;border-radius:5px;color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:999px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(30,20,10,.3)}
.toast button{background:none;border:0;color:#F2C2A4;font-weight:800}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(28px);opacity:.6}}}

/* Premium: fondo tipo foto desenfocada con grano, vidrio con brillo, numerales finos */
.scene{background:linear-gradient(180deg,#232633 0%,#3C3B48 26%,#7B6158 47%,#B98466 58%,#8B5A40 70%,#4A3022 88%,#2A1C15 100%)!important}
.scene svg{display:none}
.scene i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
.scene .b1{width:70vmax;height:40vmax;left:20%;top:44%;background:radial-gradient(closest-side,rgba(255,190,135,.85),rgba(255,150,100,0))}
.scene .b2{width:50vmax;height:50vmax;left:-20%;top:-10%;background:radial-gradient(closest-side,rgba(70,82,110,.9),rgba(70,82,110,0))}
.scene .b3{width:46vmax;height:30vmax;right:-15%;top:30%;background:radial-gradient(closest-side,rgba(205,140,140,.55),rgba(205,140,140,0))}
.scene .b4{width:90vmax;height:40vmax;left:-20%;bottom:-18%;background:radial-gradient(closest-side,rgba(30,18,12,.9),rgba(30,18,12,0))}
.scene .grain{inset:-50%;width:auto;height:auto;border-radius:0;filter:none;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(10,6,4,.55) 100%)}
.wm{font-family:var(--f-display);font-weight:500;text-transform:uppercase;font-size:17px;letter-spacing:.06em;display:block;line-height:1}
.wm-sub{display:block;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.list,.hero,.brand,.tabs,.msg,.empty,.day,.chip,.search{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 40px rgba(20,12,8,.22)!important;border-color:rgba(255,255,255,.38)!important}
.hero{background:linear-gradient(155deg,rgba(250,245,240,.66) 0%,rgba(232,222,214,.42) 60%,rgba(220,206,196,.36) 100%)!important;padding:22px 22px 18px!important}
.hero-glow{position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,150,.55),rgba(255,200,150,0));z-index:-1}
.hero-main{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.mega{font-family:var(--f-display);font-weight:200;font-size:clamp(84px,27vw,128px);line-height:.8;letter-spacing:-.03em;color:var(--ink)}
.spec{display:grid;gap:1px;font-size:12px;font-weight:600;padding-bottom:6px;min-width:0}
.spec-k{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stat .val,.big-num,.slot .h,.day b,.stepper b{font-weight:300!important}
.disp{font-weight:400!important;letter-spacing:.01em!important}
h2.disp{font-weight:300!important;font-size:30px}
.msg-k b{font-weight:500!important;letter-spacing:.06em!important;font-size:13px!important}
.tab{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:8.5px}
.chip{font-size:10px!important;letter-spacing:.16em!important}

.scene{background:linear-gradient(180deg,rgba(8,10,20,.35) 0%,rgba(8,10,20,0) 30%,rgba(8,10,20,0) 70%,rgba(8,10,20,.35) 100%),url("fondo.jpg") center 40%/cover no-repeat,#10131F!important}
.scene::after{display:none}
html{background:#10131F}
.pill.nuevo{border-color:var(--sun)!important;box-shadow:none!important}
.nuevo-b{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin-left:4px}

/* Login, app del alumno y avisos */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-wrap[hidden]{display:none!important}
.login-card{width:100%;max-width:400px;display:grid;gap:14px;background:var(--glass-strong);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:30px;padding:24px 20px;box-shadow:0 18px 50px rgba(20,12,8,.35)}
.login-card h2{color:var(--ink)}
.login-brand{display:grid;gap:2px}
.pill.aus{text-decoration:line-through;text-decoration-color:var(--warn);opacity:.75}
.aus-b{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-left:4px;text-decoration:none;display:inline-block}
.pill.rec{border-color:var(--jump)!important;box-shadow:none!important}
.rec-b{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--jump);margin-left:4px}
#portal .slot{align-items:center}
.notif-card{margin-top:14px;border-color:rgba(255,200,150,.6)!important}
#portal .hero .spec,#portal .hero .spec .small{color:var(--ink)!important}
#portal .hero .spec-k,#portal .hero .stat .lbl{color:#4A413B!important}
label.mini input[type=file]{display:none}

<script>
/* Actualización automática: si hay una versión nueva publicada, la app se recarga sola. */
window.APP_V = "20261009e";
(function () {
  let avisado = false;
  function recargar(nv) { location.replace(location.pathname + "?v=" + nv); }
  async function revisar(alAbrir) {
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
      const nv = (await r.json()).v; if (!nv || nv === window.APP_V) return;
      const ocupado = !document.getElementById("overlay") || !document.getElementById("overlay").hidden;
      if (alAbrir && !ocupado) { recargar(nv); return; }
      if (avisado) return; avisado = true;
      const b = document.createElement("button");
      b.textContent = "Hay una versión nueva · Tocá para actualizar";
      b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);z-index:99;border:0;border-radius:999px;padding:10px 16px;font:600 13px system-ui,sans-serif;background:#1e1712;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35)";
      b.onclick = () => recargar(nv); document.body.appendChild(b);
    } catch (e) {}
  }
  window.addEventListener("load", () => revisar(true));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") revisar(true); });
  setInterval(() => { if (document.visibilityState === "visible") revisar(false); }, 5 * 60 * 1000);
})();
</script>
